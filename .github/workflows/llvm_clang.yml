name: llvm toolchain
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Run custom command before building'
        required: false
        type: string

jobs:
  build_llvm:
    name: Building LLVM and Clang
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    env:
      GIT_SSL_NO_VERIFY: "true"
    container:
        image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git config
        run: |
          git --version || pacman -Sy --needed --noconfirm git
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD
          git config --global protocol.version 2
          git config --global http.sslVerify false

      - uses: actions/checkout@main

      - name: Installing Meson
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --upgrade --break-system-packages 'meson>=1.3.0'
          meson --version

      - name: Loading clang root
        id: clang_root_cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang_root

      - name: Loading x86_64 toolchain
        id: x86_64_cache
        uses: actions/cache/restore@main
        with:
          path: build_x86_64
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang-x86_64_toolchain

      - name: Loading x86_64_v3 toolchain
        id: x86_64_v3_cache
        uses: actions/cache/restore@main
        with:
          path: build_x86_64_v3
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain

      - name: Loading i686 toolchain
        id: i686_cache
        uses: actions/cache/restore@main
        with:
          path: build_i686
          key: ${{ secrets.CACHE_VERSION }}-clang-i686_toolchain-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang-i686_toolchain

      - name: Loading aarch64 toolchain
        id: aarch64_cache
        uses: actions/cache/restore@main
        with:
          path: build_aarch64
          key: ${{ secrets.CACHE_VERSION }}-clang-aarch64_toolchain-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-clang-aarch64_toolchain

      - name: Loading repository cache
        id: repository_cache
        if: false
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}
          restore-keys: ${{ secrets.CACHE_VERSION }}-repository

      - name: Running custom command
        if: ${{ github.event.inputs.command != '' }}
        continue-on-error: true
        run: ${{ github.event.inputs.command }}

      - name: Clone LLVM manually
        run: |
          if [ -d src_packages/llvm/runtimes ]; then
            echo "src_packages/llvm/runtimes already exists, skipping clone"
            exit 0
          fi
          rm -rf src_packages/llvm
          git --version
          echo "Testing git connectivity to GitHub..."
          git ls-remote --heads https://github.com/llvm/llvm-project.git release/19.x | head -3 || {
            echo "WARNING: git ls-remote failed, trying clone anyway..."
          }
          echo "Cloning LLVM (shallow, depth=1, branch release/19.x)..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 --branch=release/19.x --progress \
            https://github.com/llvm/llvm-project.git \
            src_packages/llvm || {
            echo "SSL-less clone failed, trying with full flags..."
            git -c http.sslVerify=false clone --depth=1 --branch=release/19.x --progress \
              https://github.com/llvm/llvm-project.git \
              src_packages/llvm
          }
          echo "Removing .git to prevent CMake git checks..."
          rm -rf src_packages/llvm/.git
          echo "Patching Unwind-seh.cpp for newer mingw-w64 scoped-enum EXCEPTION_DISPOSITION..."
          python3 -c "
          import re
          src = 'src_packages/llvm/libunwind/src/Unwind-seh.cpp'
          with open(src) as f: c = f.read()
          # 1) return 4 -> static_cast<EXCEPTION_DISPOSITION>(4)
          pat_return = 'return 4 /* ExceptionExecuteHandler in mingw */'
          repl_return = 'return static_cast<EXCEPTION_DISPOSITION>(4) /* ExceptionExecuteHandler in mingw */'
          c = c.replace(pat_return, repl_return)
          # 2) case 4 in switch -> default + if check (avoids enum-constexpr-conversion error)
          pat_switch = (
              '  case 4 /*ExceptionExecuteHandler*/:\n'
              '    return phase2 ? _URC_INSTALL_CONTEXT : _URC_HANDLER_FOUND;\n'
              '  default:\n'
              '    return phase2 ? _URC_FATAL_PHASE2_ERROR : _URC_FATAL_PHASE1_ERROR;'
          )
          repl_switch = (
              '  default:\n'
              '    if ((int)ms_act == 4 /*ExceptionExecuteHandler*/)\n'
              '      return phase2 ? _URC_INSTALL_CONTEXT : _URC_HANDLER_FOUND;\n'
              '    return phase2 ? _URC_FATAL_PHASE2_ERROR : _URC_FATAL_PHASE1_ERROR;'
          )
          c = c.replace(pat_switch, repl_switch)
          with open(src, 'w') as f: f.write(c)
          print('Patch: returns=' + str(c.count('static_cast<EXCEPTION_DISPOSITION>(4)')) + ' switch=' + str(c.count('(int)ms_act == 4')))
                    "
          echo "Patch applied."
          echo "Clone done. Size:"
          du -sh src_packages/llvm

      - name: Pre-clone mingw-w64
        if: ${{ steps.x86_64_cache.outputs.cache-matched-key == '' || steps.i686_cache.outputs.cache-matched-key == '' || steps.aarch64_cache.outputs.cache-matched-key == '' || steps.x86_64_v3_cache.outputs.cache-matched-key == '' }}
        run: |
          if [ -d src_packages/mingw-w64/.git ]; then
            echo "mingw-w64 already exists, skipping pre-clone"
            exit 0
          fi
          echo "Pre-cloning mingw-w64 to avoid CMake ExternalProject download failure..."
          echo "Testing git connectivity to GitHub..."
          git ls-remote --heads https://github.com/mingw-w64/mingw-w64.git master | head -3 || {
            echo "WARNING: git ls-remote failed, trying clone anyway..."
          }
          echo "Cloning mingw-w64 (shallow, depth=1)..."
          GIT_SSL_NO_VERIFY=1 git clone --depth=1 --progress \
            https://github.com/mingw-w64/mingw-w64.git \
            src_packages/mingw-w64 || {
            echo "SSL-less clone failed, retrying with full flags..."
            git -c http.sslVerify=false clone --depth=1 --progress \
              https://github.com/mingw-w64/mingw-w64.git \
              src_packages/mingw-w64 || {
              echo "Shallow clone failed, retrying with full clone..."
              git -c http.sslVerify=false clone --progress \
                https://github.com/mingw-w64/mingw-w64.git \
                src_packages/mingw-w64
            }
          }
          echo "Clone done. Size:"
          du -sh src_packages/mingw-w64

      - name: Pre-clone cppwinrt
        if: ${{ steps.x86_64_cache.outputs.cache-matched-key == '' || steps.i686_cache.outputs.cache-matched-key == '' || steps.aarch64_cache.outputs.cache-matched-key == '' || steps.x86_64_v3_cache.outputs.cache-matched-key == '' }}
        run: |
          if [ -d src_packages/cppwinrt/.git ]; then
            echo "cppwinrt already exists, skipping pre-clone"
            exit 0
          fi
          echo "Pre-cloning cppwinrt to avoid CMake ExternalProject download failure..."
          git clone --depth=1 --progress \
            https://github.com/microsoft/cppwinrt.git \
            src_packages/cppwinrt || {
            echo "Shallow clone failed, retrying with full clone..."
            git clone --progress \
              https://github.com/microsoft/cppwinrt.git \
              src_packages/cppwinrt
          }
          echo "Clone done. Size:"
          du -sh src_packages/cppwinrt

      - name: Building LLVM with IR Profile Instrumentation
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm
          ninja -C build_x86_64 rustup
          ninja -C build_x86_64 cargo-clean

      - name: Building x86_64 toolchain
        id: x86_64_build
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm-clang || {
            rc=$?
            echo ""
            echo "==================== BUILD FAILED - DUMPING LOGS ===================="
            echo "=== x86_64 configure error logs ==="
            for f in $(find build_x86_64/toolchain -name "*-configure-err.log" 2>/dev/null); do
              if [ -s "$f" ]; then echo "--- $f ---"; tail -120 "$f"; fi
            done
            echo "=== x86_64 build error logs (stderr) ==="
            for f in $(find build_x86_64/toolchain -name "*-build-err.log" 2>/dev/null); do
              if [ -s "$f" ]; then echo "--- $f ---"; tail -120 "$f"; fi
            done
            echo "=== x86_64 build output logs (stdout) ==="
            for f in $(find build_x86_64/toolchain -name "*-build-out.log" 2>/dev/null); do
              if [ -s "$f" ]; then echo "--- $f ---"; tail -120 "$f"; fi
            done
            echo "=== llvm-libcxx stamp dir ==="
            stamp_dir=$(find build_x86_64/toolchain -maxdepth 6 -type d -name "llvm-libcxx-stamp" 2>/dev/null)
            if [ -n "$stamp_dir" ]; then
              echo "STAMP: $stamp_dir"
              ls -la "$stamp_dir/"
              echo ""
              shopt -s nullglob
              for f in "$stamp_dir"/*.log; do
                if [ -s "$f" ]; then echo "--- $f (last 200 lines) ---"; tail -200 "$f"; else echo "--- $f (empty) ---"; fi
              done
              shopt -u nullglob
            else
              echo "llvm-libcxx stamp dir not found"
            fi
            echo ""
            echo "=== llvm-libcxx build dir ==="
            llvm_build_dir=$(find build_x86_64/toolchain -maxdepth 6 -type d -name "llvm-libcxx-build" 2>/dev/null)
            if [ -n "$llvm_build_dir" ]; then
              echo "BUILD: $llvm_build_dir"
              ls -la "$llvm_build_dir/" 2>/dev/null | head -30
              WORKSPACE="$PWD"
              if [ -f "$llvm_build_dir/build.ninja" ]; then
                echo "build.ninja exists ($(wc -l < "$llvm_build_dir/build.ninja") lines)"
                echo ""
                echo "=== Attempting manual ninja -v via exec wrapper (first 200 lines) ==="
                "$WORKSPACE/build_x86_64/exec" LTO=0 ninja -v -j1 -C "$llvm_build_dir" 2>&1 | head -200 || true
              else
                echo "build.ninja NOT FOUND! Checking for CMakeCache.txt..."
                if [ -f "$llvm_build_dir/CMakeCache.txt" ]; then
                  grep -E "CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:|LLVM_ENABLE_RUNTIMES" "$llvm_build_dir/CMakeCache.txt" | head -10
                fi
              fi
            else
              echo "llvm-libcxx-build directory not found"
            fi
            exit $rc
          }

      - name: Building x86_64-v3 toolchain
        id: x86_64_v3_build
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DGCC_ARCH=x86-64-v3 -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64_v3/x86_64_v3-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64_v3 -S $PWD
          ninja -C build_x86_64_v3 llvm-clang

      - name: Dump x86_64_v3 build logs (on failure)
        if: ${{ failure() && steps.x86_64_v3_build.outcome == 'failure' }}
        run: |
          echo "=== x86_64_v3 configure error logs ==="
          for f in $(find build_x86_64_v3/toolchain -name "*-configure-err.log" 2>/dev/null); do
            if [ -s "$f" ]; then
              echo "--- $f ---"
              tail -120 "$f"
            fi
          done
          echo "=== x86_64_v3 build error logs (stderr) ==="
          for f in $(find build_x86_64_v3/toolchain -name "*-build-err.log" 2>/dev/null); do
            if [ -s "$f" ]; then
              echo "--- $f ---"
              tail -120 "$f"
            fi
          done
          echo "=== x86_64_v3 build output logs (stdout) ==="
          for f in $(find build_x86_64_v3/toolchain -name "*-build-out.log" 2>/dev/null); do
            if [ -s "$f" ]; then
              echo "--- $f ---"
              tail -120 "$f"
            fi
          done
          echo "=== llvm build dir .log files ==="
          shopt -s nullglob
          for d in $(find build_x86_64_v3/toolchain -maxdepth 5 -type d -name "*-build" 2>/dev/null); do
            for f in "$d"/*.log; do
              if [ -f "$f" ] && [ -s "$f" ]; then
                echo "--- $f (last 120 lines) ---"
                tail -120 "$f"
              fi
            done
          done
          shopt -u nullglob

      - name: Building i686 toolchain
        id: i686_build
        run: |
          cmake -DTARGET_ARCH=i686-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_i686/i686-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_i686 -S $PWD
          ninja -C build_i686 llvm-clang

      - name: Building aarch64 toolchain
        id: aarch64_build
        run: |
          cmake -DTARGET_ARCH=aarch64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_aarch64/aarch64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_aarch64 -S $PWD
          ninja -C build_aarch64 llvm-clang

      - name: Dump all build error logs (on failure)
        if: ${{ failure() }}
        run: |
          echo "========= Scanning for build/configure errors ========="
          for build_dir in build_x86_64 build_x86_64_v3 build_i686 build_aarch64; do
            echo "--- Scanning $build_dir ---"
            shopt -s nullglob
            for errlog in $(find "$build_dir" -name "*-configure-err.log" -o -name "*-build-err.log" -o -name "*-build-out.log" 2>/dev/null); do
              if [ -s "$errlog" ]; then
                echo "=== $errlog ==="
                tail -100 "$errlog"
              fi
            done
            for d in $(find "$build_dir" -maxdepth 5 -type d -name "*-build" 2>/dev/null); do
              for f in "$d"/*.log; do
                if [ -f "$f" ] && [ -s "$f" ]; then
                  echo "=== $f (last 100 lines) ==="
                  tail -100 "$f"
                fi
              done
            done
            shopt -u nullglob
          done

      - name: PGO training with shaderc
        if: ${{ steps.clang_root_cache.outputs.cache-matched-key == '' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=GEN -DCLANG_PACKAGES_LTO=ON -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 shaderc

      - name: Merging profraw to profdata
        if: ${{ steps.clang_root_cache.outputs.cache-matched-key == '' }}
        run: |
          llvm-profdata merge $PWD/clang_root/profiles/*.profraw -o llvm.profdata
          rm -rf $PWD/clang_root/profiles/* || true

      - name: Building LLVM with PGO
        if: ${{ steps.clang_root_cache.outputs.cache-matched-key == '' }}
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DLLVM_ENABLE_PGO=USE -DLLVM_PROFDATA_FILE="llvm.profdata" -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm

      - name: Cleanup
        run: |
          rm -rf {build_i686,build_x86_64,build_x86_64_v3,build_aarch64}/{toolchain,packages} || true

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_x86_64_logs build_i686_logs build_aarch64_logs
          cp -fr $(find build_x86_64 -type f -iname "*-*.log") build_x86_64_logs || true
          cp -fr $(find build_i686 -type f -iname "*-*.log") build_i686_logs || true
          cp -fr $(find build_aarch64 -type f -iname "*-*.log") build_aarch64_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: logs
          path: logs.7z
          retention-days: 1

      - name: Uploading toolchain
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: toolchain
          path: clang_root

      - name: Saving clang root
        if: always()
        uses: actions/cache/save@main
        with:
          path: clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}

      - name: Saving x86_64 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_x86_64
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_toolchain-${{ github.run_id }}

      - name: Saving x86_64_v3 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_x86_64_v3
          key: ${{ secrets.CACHE_VERSION }}-clang-x86_64_v3_toolchain-${{ github.run_id }}

      - name: Saving i686 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_i686
          key: ${{ secrets.CACHE_VERSION }}-clang-i686_toolchain-${{ github.run_id }}

      - name: Saving aarch64 toolchain
        if: always()
        uses: actions/cache/save@main
        with:
          path: build_aarch64
          key: ${{ secrets.CACHE_VERSION }}-clang-aarch64_toolchain-${{ github.run_id }}

      - name: Saving repository cache
        if: false
        uses: actions/cache/save@main
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}

  call_workflow:
    name: Run mpv_clang
    runs-on: ubuntu-latest
    needs: build_llvm

    permissions:
      actions: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_REF: ${{ github.ref_name }}

    steps:
      - name: Run mpv_clang.yml
        run: |
          set -euo pipefail

          jq -n \
            --arg ref "$BUILD_REF" \
            '{
              ref: $ref,
              inputs: {
                github_release: "false"
              }
            }' > dispatch.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/mpv_clang.yml/dispatches" \
            --data-binary @dispatch.json
